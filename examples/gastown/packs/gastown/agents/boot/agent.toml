scope = "city"
wake_mode = "fresh"
work_dir = ".gc/agents/boot"
max_active_sessions = 1
# Watchdog gate: boot exists to verify gastown.deacon isn't stuck. While
# deacon has had a successful wake within watchdog_stale_threshold, boot
# has nothing new to verify and the controller skips its wake. Boot
# fires only when deacon's creation_complete_at is older than 5m,
# meaning deacon may be stuck. Replaces a fixed-cadence floor with a
# need-driven trigger.
watchdog_target_template = "gastown.deacon"
watchdog_stale_threshold = "5m"
