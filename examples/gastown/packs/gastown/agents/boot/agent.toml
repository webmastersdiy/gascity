scope = "city"
wake_mode = "fresh"
work_dir = ".gc/agents/boot"
max_active_sessions = 1
# Temporary fallback to min_wake_interval. The watchdog gate uses
# CreatedAt of assignee=deacon beads, which advances per new wisp but
# not per patrol step within a wisp - so the gate still fires when
# deacon is busy working a single long wisp. UpdatedAt would be the
# right signal but is not exposed in the Go Bead struct. Pending an
# events.jsonl-based signal (see open polecat task), reverting to the
# 5m floor so the city doesn't burn while iterating.
min_wake_interval = "5m"
