scope = "city"
wake_mode = "fresh"
work_dir = ".gc/agents/boot"
max_active_sessions = 1
# Throttle re-spawn: with wake_mode = "fresh", the controller's
# drain-followup poke would otherwise re-spawn boot within ~15s of
# every drain, regardless of patrol_interval. min_wake_interval bounds
# the wake cadence using boot's own creation_complete_at - simple but
# fires regularly even when deacon is healthy.
#
# (The watchdog_target_template gate was tested but uses
# creation_complete_at on the TARGET, which only updates on the
# target's session START - not on patrol cycles within a long-running
# session. For boot+deacon that signal is wrong: deacon stays in one
# session for hours so its creation_complete_at goes "stale" by the
# threshold while deacon is actually patrolling fine. A working
# watchdog signal needs to look at wisp/bead activity instead, which
# requires more design work. Reverting to the floor for now.)
min_wake_interval = "5m"
