scope = "city"
wake_mode = "fresh"
work_dir = ".gc/agents/boot"
max_active_sessions = 1
# Watchdog gate: boot exists to verify gastown.deacon isn't stuck. Boot's
# wake is deferred while the most-recent CreatedAt of an assignee=deacon
# bead is within watchdog_stale_threshold. Deacon's patrol formula creates
# a fresh wisp bead per cycle and assigns it to the deacon identity, so
# this signal advances continuously while deacon is making progress and
# goes stale promptly when deacon stops generating new wisps. The
# watchdog fires only when deacon may be stuck.
#
# Threshold must exceed deacon's max exponential-backoff cap (~300s /
# 5m) or boot will fire once per deacon backoff cycle in an idle city.
# 10m clears that cap with margin and lets boot stay silent during
# normal idle.
watchdog_target_template = "gastown.deacon"
watchdog_stale_threshold = "10m"
